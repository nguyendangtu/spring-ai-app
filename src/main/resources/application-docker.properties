spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/stockdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:stockuser}
spring.datasource.password=${DB_PASSWORD:stockpass}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

