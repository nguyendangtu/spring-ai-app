server.port=${SERVER_PORT:8081}
spring.application.name=${APP_NAME:spring-boot-app}
spring.main.banner-mode=console
logging.level.root=INFO

# Local defaults use H2 for easy startup; override with DB_* env vars to use MySQL in Docker/production.
spring.datasource.url=${DB_URL:jdbc:h2:mem:stockdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.defer-datasource-initialization=true

# H2 Console for local troubleshooting
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# Keep script initialization off; the app seeds demo data in Java for both H2 and MySQL.
spring.sql.init.mode=never

# Feature flag for optional demo seed data; default true so the stock screen shows sample rows immediately after login.
app.seed-data=${APP_SEED_DATA:true}

# Spring AI / OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY:<your_api_key>}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=${OPENAI_TEMPERATURE:0.2}
